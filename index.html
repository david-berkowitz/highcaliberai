<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/693b1c5eede2934f1ee50170/2679ed99d_highcaliberaibiggerlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>High Caliber AI – Applied AI for Marketing</title>
    <script>
(function() {
  try {
    var path = window.location.pathname;
    if (path.length <= 1) return;
    var seg = path.split('/').filter(Boolean)[0];
    if (!seg) return;
    var pascal = seg.charAt(0).toUpperCase() + seg.slice(1);
    if (seg !== pascal) {
      window.location.replace(window.location.origin + '/' + pascal + window.location.search);
      return;
    }
    var correct = window.location.origin + '/' + pascal;
    var c = document.querySelector('link[rel="canonical"]');
    if (c) c.href = correct;
    var og = document.querySelector('meta[property="og:url"]');
    if (og) og.content = correct;
  } catch(e) {}
})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
