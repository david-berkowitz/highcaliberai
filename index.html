<title>Base44 APP</title>
<script>
    (function() {
      var path = window.location.pathname;
      if (path.length <= 1) return;
      var seg = path.split('/').filter(Boolean)[0];
      if (!seg) return;
      var pascal = seg.charAt(0).toUpperCase() + seg.slice(1);
      if (seg !== pascal) {
        window.location.replace(window.location.origin + '/' + pascal + window.location.search);
      }
    })();
</script>
<script>
    (function() {
      // Only noindex true utility/functional routes with no real content
      var noindexRoutes = [
        '/blogpost', '/article',
        '/courseaccess', '/coursehome', '/coursesuccess',
        '/partnersubmit', '/partnersubmitsuccess',
        '/resourcesubmit', '/contentuploader',
        '/progress'
      ];
      var path = window.location.pathname.toLowerCase().replace(/\/$/, '');
      if (noindexRoutes.indexOf(path) !== -1) {
        var meta = document.createElement('meta');
        meta.name = 'robots';
        meta.content = 'noindex, nofollow';
        [document.head.app](https://document.head.app)endChild(meta);
      }
    })();
</script>
