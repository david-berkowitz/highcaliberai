<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>

    <script>
    (function() {
      var path = window.location.pathname;
      if (path.length <= 1) return;
      var seg = path.split('/').filter(Boolean)[0];
      if (!seg) return;
      var pascal = seg.charAt(0).toUpperCase() + seg.slice(1);
      if (seg !== pascal) {
        window.location.replace(window.location.origin + '/' + pascal + window.location.search);
      }
    })();
    </script>

    <script>
    (function() {
      var noindexRoutes = [
        '/article', '/audit', '/bd', '/baruch', '/bing', '/blogpost',
        '/contentuploader', '/contentmarketingtools', '/courseaccess',
        '/coursehome', '/coursesuccess', '/cricket', '/foaf', '/holidays',
        '/hustle', '/ic', '/ice', '/jobs', '/lux', '/luxuryrealestate',
        '/offsite', '/partnersubmit', '/partnersubmitsuccess', '/politics',
        '/progress', '/queenstech', '/resourcesubmit', '/sos', '/toolshub',
        '/aimgfaq', '/aistrategyhub', '/agenticquickstart', '/agenticusecaselibrary',
        '/guestlectures', '/mensch', '/partnerfaq'
      ];
      var path = window.location.pathname.toLowerCase().replace(/\/$/, '');
      if (noindexRoutes.indexOf(path) !== -1) {
        var meta = document.createElement('meta');
        meta.name = 'robots';
        meta.content = 'noindex, nofollow';
        [document.head.app](https://document.head.app)endChild(meta);
      }
    })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
