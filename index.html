    <script>
(function() {

    var path = window.location.pathname;
    var search = window.location.search;

    // ── PascalCase redirect ─────────────────────────────────────────────
    if (path.length > 1) {
      var seg = path.split('/').filter(Boolean)[0];
      if (seg) {
        var pascal = seg.charAt(0).toUpperCase() + seg.slice(1);
        if (seg !== pascal) {
          window.location.replace(window.location.origin + '/' + pascal + search);
          return;
        }
      }
    }

    // ── Canonical (lowercase path to avoid redirect conflicts) ──────────
    var canonicalBase = 'https://highcaliberai.com';
    var canonicalPath = path === '/' ? '' : path.toLowerCase();

    // For blog posts with ?slug=, make canonical clean (no query string)
    var pathLower = path.toLowerCase();
    var isBlogPost = pathLower.indexOf('blogpost') > -1 || pathLower.indexOf('article') > -1;
    var cleanCanonical;
    if (isBlogPost && search) {
      var slugMatch = search.match(/slug=([^&]+)/);
      if (slugMatch) {
        var slug = decodeURIComponent(slugMatch[1]);
        cleanCanonical = canonicalBase + '/blog/' + slug;
      }
    }
    var canonicalURL = cleanCanonical || (canonicalBase + canonicalPath);

    var c = document.querySelector('link[rel="canonical"]');
    if (c) { c.href = canonicalURL; } else {
      var l = document.createElement('link'); l.rel = 'canonical'; l.href = canonicalURL;
      document.head.appendChild(l);
    }
    var og = document.querySelector('meta[property="og:url"]');
    if (og) og.content = canonicalURL;
    var tw = document.querySelector('meta[name="twitter:url"]');
    if (tw) tw.content = canonicalURL;

      var ni = document.querySelector('meta[name="robots"]');
      if (!ni) { ni = document.createElement('meta'); ni.name = 'robots'; document.head.appendChild(ni); }
      ni.content = 'noindex, nofollow';
    }

    // ── Apply meta ──────────────────────────────────────────────────────
    var meta = PAGE_META[pathLower] || PAGE_META[pathLower.replace(/\/$/, '')];

    // Blog post: derive title + add generic desc from slug
    if (isBlogPost && search) {
      var slugMatch2 = search.match(/slug=([^&]+)/);
      if (slugMatch2) {
        var slug2 = decodeURIComponent(slugMatch2[1]);
        var titleFromSlug = slug2.replace(/-/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });

      meta = {
        title: 'AI Marketing Speaker in ' + city + ' | David Berkowitz | High Caliber AI',
        desc: city + ' event planners: Book David Berkowitz for AI marketing keynotes and workshops. 400+ speaking engagements, founder of AI Marketers Guild (7,000+ members).'

    }

    if (meta) {
      document.title = meta.title;
      var ogt = document.querySelector('meta[property="og:title"]');
      if (ogt) ogt.content = meta.title;
      var twt = document.querySelector('meta[name="twitter:title"]');
      if (twt) twt.content = meta.title;
      if (meta.desc) {
        var d = document.querySelector('meta[name="description"]');
        if (d) d.content = meta.desc;
        var ogd = document.querySelector('meta[property="og:description"]');
        if (ogd) ogd.content = meta.desc;
        var twd = document.querySelector('meta[name="twitter:description"]');
        if (twd) twd.content = meta.desc;
      }
    }

  } catch(e) {}
})();
